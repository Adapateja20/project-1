
- name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:slim'
  id: 'Prepare Kubernetes Manifests'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -e

      echo "Checking Kubernetes manifest files..."
      test -f kubernetes/app1.yaml
      test -f kubernetes/app2.yaml

      echo "Updating App1 image..."
      sed -i "s|image: .*quickstart-image.*|image: us-central1-docker.pkg.dev/project-8384ed62-c311-4520-abc/gke-repo/quickstart-image:$SHORT_SHA|" kubernetes/app1.yaml

      echo "Updating App2 image..."
      sed -i "s|image: .*flask-image.*|image: us-central1-docker.pkg.dev/project-8384ed62-c311-4520-abc/gke-repo/flask-image:$SHORT_SHA|" kubernetes/app2.yaml

      echo "App1 manifest:"
      cat kubernetes/app1.yaml

      echo "App2 manifest:"
      cat kubernetes/app2.yaml
